<path d="M720 975 H1070 V1010" class="line"/>
<rect x="70" y="140" width="420" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="92" y="172" class="head">Official raw NASA logs</text>
<text x="92" y="204" class="body">July + August 1995; unchanged bytes</text>
<text x="92" y="231" class="body">3,461,613 records; decompression only</text>
<rect x="530" y="140" width="380" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="552" y="172" class="head">CLI + shared controller</text>
<text x="552" y="204" class="body">Select engine and batch size N</text>
<text x="552" y="231" class="body">Run ID, clock, counts, lifecycle</text>
<rect x="950" y="140" width="420" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="972" y="172" class="head">Shared contracts/</text>
<text x="972" y="204" class="body">Regexes, months, output columns</text>
<text x="972" y="231" class="body">Same parsing and query semantics</text>
<rect x="530" y="280" width="380" height="100" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="552" y="312" class="head">Shared batcher</text>
<text x="552" y="344" class="body">N input records; sequential batch IDs</text>
<text x="552" y="371" class="body">Unchanged pieces + BatchSpec</text>
<rect x="90" y="430" width="570" height="230" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="112" y="457" class="tag">IMPLEMENTED / TESTED</text>
<text x="112" y="488" class="head">MongoDB 7 engine</text>
<text x="112" y="520" class="body">Person A: raw ingestion, $regexFind, Q1</text>
<text x="112" y="547" class="body">Person B: Q2 top 20 + Q3 hourly errors</text>
<text x="112" y="574" class="body">Exact host counts via two-stage $group</text>
<text x="112" y="601" class="body">Retain parsed rows for whole-run finalize()</text>
<rect x="780" y="430" width="570" height="230" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="802" y="457" class="tag">IMPLEMENTED / TESTED</text>
<text x="802" y="488" class="head">Hive 4.0.1 engine</text>
<text x="802" y="520" class="body">Person C: RegexSerDe, HiveQL parsing, Q1</text>
<text x="802" y="547" class="body">Person D: Q2 top 20 + Q3 hourly errors</text>
<text x="802" y="574" class="body">One multi-insert scan per batch, ORC tables</text>
<text x="802" y="601" class="body">Partitions kept for whole-run finalize()</text>
<rect x="450" y="705" width="540" height="95" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="472" y="737" class="head">Batch results + exact final results</text>
<text x="472" y="769" class="body">q1.tsv / q2.tsv / q3.tsv + malformed.tsv</text>
<text x="738" y="830" class="small" style="fill:#526783">COPY + per-batch transaction</text>
<rect x="450" y="850" width="540" height="95" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="472" y="882" class="head">PostgreSQL 15 | shared loader</text>
<text x="472" y="914" class="body">Run, batch, execution metadata + Q1-Q3 tables</text>
<rect x="80" y="1010" width="620" height="130" rx="14" fill="#eaf0fd" stroke="#7794cd" stroke-width="2"/>
<text x="102" y="1042" class="head">Person B: SQL equivalence checker</text>
<text x="102" y="1074" class="body">Validate input identity + batch size + completion</text>
<text x="102" y="1101" class="body">Compare every batch + final rows; report differences</text>
<rect x="780" y="1010" width="580" height="130" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="802" y="1042" class="head">Reporting module</text>
<text x="802" y="1074" class="body">Read stored results + runtime + batch statistics</text>
<text x="802" y="1101" class="body">python -m etl report: terminal + HTML export</text>
<text x="80" y="1180" class="small" style="fill:#526783">Reference engine: test-only oracle, excluded from demo/report pipelines. Dashed arrows carry contracts.</text>
</svg>