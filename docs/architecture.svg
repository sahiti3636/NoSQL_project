<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526783"/></marker></defs>
<rect width="1440" height="1250" fill="#f3f6fb"/>
<style>text{font-family:Arial,sans-serif;fill:#182b45}.title{font-size:35px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:16px}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#3f7a5f}.line{fill:none;stroke:#526783;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="60" y="57" class="title">NASA log analytics | Final architecture</text>
<text x="60" y="91" class="body" style="fill:#526783">Four pipelines, one controller: same raw input, same contracts, identical results on every batch and the whole run</text>
<!-- top row -> batcher -->
<path d="M280 245 V325 H525" class="line"/>
<path d="M720 245 V280" class="line"/>
<!-- batcher -> engines -->
<path d="M720 380 V412 H192 V462" class="line"/>
<path d="M720 412 H544 V462" class="line"/>
<path d="M720 412 H896 V462" class="line"/>
<path d="M720 412 H1248 V462" class="line"/>
<!-- contracts -> docker frame (dashed) -->
<path d="M1160 245 V262 H1420 V560 H1412" class="line" stroke-dasharray="7 6"/>
<!-- engines -> outputs -->
<path d="M192 712 V792 H445" class="line"/>
<path d="M544 712 V745" class="line"/>
<path d="M896 712 V745" class="line"/>
<path d="M1248 712 V792 H995" class="line"/>
<!-- outputs -> postgres -> consumers -->
<path d="M720 840 V888" class="line"/>
<path d="M720 983 V1012 H390 V1045" class="line"/>
<path d="M720 1012 H1070 V1045" class="line"/>
<!-- top row boxes -->
<rect x="70" y="140" width="420" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="92" y="172" class="head">Official raw NASA logs</text>
<text x="92" y="204" class="body">July + August 1995; unchanged bytes</text>
<text x="92" y="231" class="body">3,461,613 records; decompression only</text>
<rect x="530" y="140" width="380" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="552" y="172" class="head">CLI + shared controller</text>
<text x="552" y="204" class="body">--pipeline; --batch-size N or --no-batch</text>
<text x="552" y="231" class="body">Run ID, clock, counts, lifecycle</text>
<rect x="950" y="140" width="420" height="105" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="972" y="172" class="head">Shared contracts/</text>
<text x="972" y="204" class="body">Regexes, month map, output columns</text>
<text x="972" y="231" class="body">Same parsing and query rules everywhere</text>
<rect x="530" y="280" width="380" height="100" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="552" y="312" class="head">Shared batcher</text>
<text x="552" y="344" class="body">N input lines; batch IDs 1, 2, 3, ...</text>
<text x="552" y="371" class="body">Unchanged byte pieces + BatchSpec</text>
<!-- docker frame around the engines -->
<rect x="18" y="440" width="1394" height="290" rx="18" fill="none" stroke="#7794cd" stroke-width="2" stroke-dasharray="9 7"/>
<text x="212" y="433" class="small" style="fill:#4a6aa8;font-weight:700">Docker · pinned images</text>
<text x="916" y="433" class="small" style="fill:#4a6aa8;font-weight:700">every engine loads contracts/</text>
<!-- four engines -->
<rect x="32" y="462" width="320" height="250" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="50" y="488" class="tag">PHASE 1 · SAHITI + TUSHAAR</text>
<text x="50" y="518" class="head">MongoDB 7</text>
<text x="50" y="550" class="small">Raw lines inserted as documents</text>
<text x="50" y="576" class="small">$regexFind parse → $merge</text>
<text x="50" y="602" class="small">Q1–Q3 as $group aggregations</text>
<text x="50" y="628" class="small">Q2: top 20 first, then hosts</text>
<text x="50" y="654" class="small">Parsed collection kept for</text>
<text x="50" y="678" class="small">whole-run finalize()</text>
<rect x="384" y="462" width="320" height="250" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="402" y="488" class="tag">PHASE 1 · AMAN + PRAJWAL</text>
<text x="402" y="518" class="head">Hive 4.0.1</text>
<text x="402" y="550" class="small">RegexSerDe reads whole lines</text>
<text x="402" y="576" class="small">One multi-insert scan per batch:</text>
<text x="402" y="602" class="small">parsed + malformed + counts</text>
<text x="402" y="628" class="small">ORC tables, batch partitions</text>
<text x="402" y="654" class="small">HiveQL Q1–Q3; partitions kept</text>
<text x="402" y="678" class="small">for whole-run finalize()</text>
<rect x="736" y="462" width="320" height="250" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="754" y="488" class="tag">PHASE 2 · SAHITI + TUSHAAR</text>
<text x="754" y="518" class="head">MapReduce (Hadoop 3.3.6)</text>
<text x="754" y="550" class="small">ParseJob (map only) → LogRecord</text>
<text x="754" y="576" class="small">SequenceFiles + malformed</text>
<text x="754" y="602" class="small">Q1Job, Q2Job (2 jobs), Q3Job,</text>
<text x="754" y="628" class="small">combiners; CountJob at the end</text>
<text x="754" y="654" class="small">RunJobs: one JVM per batch,</text>
<text x="754" y="678" class="small">each job timed separately</text>
<rect x="1088" y="462" width="320" height="250" rx="14" fill="#e9f6f0" stroke="#64a98a" stroke-width="2"/>
<text x="1106" y="488" class="tag">PHASE 2 · AMAN + PRAJWAL</text>
<text x="1106" y="518" class="head">Pig 0.18</text>
<text x="1106" y="550" class="small">TextLoader + RegexFind,</text>
<text x="1106" y="576" class="small">months.tsv joined in Pig</text>
<text x="1106" y="602" class="small">BinStorage parsed + malformed</text>
<text x="1106" y="628" class="small">Pig Latin Q1–Q3 (byte-order Q2)</text>
<text x="1106" y="654" class="small">One Pig session per batch,</text>
<text x="1106" y="678" class="small">each script timed separately</text>
<!-- outputs, storage, consumers -->
<rect x="450" y="745" width="540" height="95" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="472" y="777" class="head">Batch results + exact whole-run results</text>
<text x="472" y="809" class="body">q1.tsv / q2.tsv / q3.tsv + malformed.tsv</text>
<text x="738" y="870" class="small" style="fill:#526783">COPY, one transaction per batch</text>
<rect x="450" y="888" width="540" height="95" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="472" y="920" class="head">PostgreSQL 15 | shared loader</text>
<text x="472" y="952" class="body">Run, batch, query metadata + Q1–Q3 tables</text>
<rect x="80" y="1045" width="620" height="130" rx="14" fill="#eaf0fd" stroke="#7794cd" stroke-width="2"/>
<text x="102" y="1077" class="head">Equivalence checker (python -m etl.compare)</text>
<text x="102" y="1109" class="body">Same input, batch size, completed runs</text>
<text x="102" y="1136" class="body">Compares every batch + final row of any two engines</text>
<rect x="780" y="1045" width="580" height="130" rx="14" fill="#ffffff" stroke="#bccade" stroke-width="2"/>
<text x="802" y="1077" class="head">Reporting module (python -m etl report)</text>
<text x="802" y="1109" class="body">Results + runtime + batch statistics</text>
<text x="802" y="1136" class="body">Terminal, HTML export, four-engine comparison</text>
<text x="80" y="1220" class="small" style="fill:#526783">Python only cuts byte-exact batches, starts the engine and loads its result files; it never parses a log line. Dashed arrow: shared contracts.</text>
</svg>
