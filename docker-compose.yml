# NASA Log ETL environment: PostgreSQL + MongoDB + Hive (Phase 1) + Pig/MapReduce (Phase 2)
#   docker compose up -d          start everything
#   docker compose ps             all three should say "healthy"
#   docker compose down           stop (data is kept in volumes)
#   docker compose down -v        stop AND wipe all databases
# Local development only: the passwords below are not secrets.

name: nasa-etl

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nasa_etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    ports:
      - "${PG_PORT:-5433}:5432"   # 5433 on the laptop: 5432 is often taken by a local PostgreSQL
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on the very first start (empty volume)
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d nasa_etl"]
      interval: 5s
      retries: 20

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/input:ro
      - ./contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  hive:
    image: apache/hive:4.0.1
    # The image keeps HiveServer2's pid file inside the container. After Docker Desktop restarts,
    # the stale file makes HiveServer2 refuse to start ("running as process 7. Stop it first"),
    # so remove it before the image's own entrypoint runs.
    entrypoint: ["sh", "-c", "rm -f /opt/hive/conf/hiveserver2.pid; exec /entrypoint.sh"]
    environment:
      SERVICE_NAME: hiveserver2
      # Larger heap so whole-run queries over 3.4M lines don't run out of memory
      HADOOP_HEAPSIZE: "2048"
    ports:
      - "${HIVE_PORT:-10000}:10000"   # JDBC / beeline
      - "10002:10002"                 # HiveServer2 web UI
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
      - ./data:/input:ro              # raw NASA logs (never modified)
      - ./contracts:/contracts:ro
      - ./runs:/runs                  # batch folders in, result files out
    healthcheck:
      test: ["CMD-SHELL", "beeline -u jdbc:hive2://localhost:10000/ -e 'select 1' > /dev/null 2>&1"]
      interval: 15s
      timeout: 60s
      retries: 20
      start_period: 60s

  # Phase 2: Pig and MapReduce (Hadoop 3.3.6 local mode). Built locally from docker/hadoop/Dockerfile,
  # which pins every base image and download. Idle until a pipeline runs `pig` or `hadoop jar` in it.
  hadoop:
    build: ./docker/hadoop
    image: nasa-etl-hadoop:phase2
    environment:
      PIG_HEAPSIZE: "2048"            # MB, for Pig in local mode
      HADOOP_HEAPSIZE_MAX: "2g"       # for `hadoop jar` (MapReduce local mode)
    volumes:
      - ./data:/input:ro              # raw NASA logs (never modified)
      - ./contracts:/contracts:ro
      - ./mapreduce:/mapreduce:ro     # MapReduce Java sources, compiled at the start of each run
      - ./runs:/runs                  # batch folders in, result files out
    healthcheck:
      # Checks the tools are installed without starting a JVM: a check that ran `pig -version`,
      # `javac -version` and `hadoop version` started three JVMs every 15 s and took CPU away from
      # whatever engine was being timed. scripts/check_phase2.py runs real Pig and MapReduce jobs.
      test: ["CMD-SHELL", "test -x /opt/pig/bin/pig && test -x /opt/jdk8/bin/javac && test -x /opt/hadoop/bin/hadoop"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  pg_data:
  mongo_data:
  hive_warehouse:
